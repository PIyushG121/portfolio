<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090d16"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="14"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 80 H600 M0 160 H600 M0 240 H600 M0 320 H600" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M120 0 V400 M240 0 V400 M360 0 V400 M480 0 V400" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Top Navbar Preview -->
  <rect x="24" y="20" width="552" height="42" fill="#1E293B" rx="8" opacity="0.8"/>
  <circle cx="46" cy="41" r="7" fill="url(#primaryGrad)"/>
  <text x="62" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="0.5">TradeFluenza</text>
  <rect x="420" y="30" width="60" height="22" rx="4" fill="#334155"/>
  <rect x="490" y="30" width="70" height="22" rx="4" fill="url(#primaryGrad)"/>
  <text x="502" y="45" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF">Vanguard</text>

  <!-- Hero Header Title -->
  <text x="34" y="100" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">Empowering Traders Worldwide</text>
  <text x="34" y="122" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Top Prop Firms, Broker Comparisons &amp; Cashback Platform</text>

  <!-- 3 Metric / Feature Cards -->
  <!-- Card 1: Prop Firms -->
  <rect x="34" y="146" width="166" height="150" fill="url(#cardGrad)" rx="10" stroke="#334155" stroke-width="1"/>
  <circle cx="60" cy="176" r="14" fill="#F59E0B" opacity="0.2"/>
  <path d="M56 172 H64 M60 168 V184" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="84" y="180" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Prop Firms</text>
  <text x="46" y="210" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Compare account sizes &amp; profit splits.</text>
  <rect x="46" y="246" width="142" height="28" rx="6" fill="#F59E0B" opacity="0.15"/>
  <text x="76" y="264" font-family="system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#FBBF24">Top Rated ★</text>

  <!-- Card 2: Mentors & Live Events -->
  <rect x="216" y="146" width="166" height="150" fill="url(#cardGrad)" rx="10" stroke="#6366F1" stroke-width="1.2"/>
  <circle cx="242" cy="176" r="14" fill="#6366F1" opacity="0.25"/>
  <path d="M236 178 L242 170 L248 178" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="266" y="180" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Live Events</text>
  <text x="228" y="210" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Webinars &amp; trading competitions.</text>
  <rect x="228" y="246" width="142" height="28" rx="6" fill="url(#primaryGrad)"/>
  <text x="254" y="264" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" fill="#FFFFFF">Explore Events →</text>

  <!-- Card 3: Brokers & Reviews -->
  <rect x="398" y="146" width="166" height="150" fill="url(#cardGrad)" rx="10" stroke="#334155" stroke-width="1"/>
  <circle cx="424" cy="176" r="14" fill="#10B981" opacity="0.2"/>
  <circle cx="424" cy="176" r="6" stroke="#10B981" stroke-width="2"/>
  <text x="448" y="180" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Brokers</text>
  <text x="410" y="210" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Verified reviews &amp; regulation insights.</text>
  <rect x="410" y="246" width="142" height="28" rx="6" fill="#10B981" opacity="0.15"/>
  <text x="440" y="264" font-family="system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#34D399">Verified Reg ✓</text>

  <!-- Bottom Live Stat Banner -->
  <rect x="34" y="316" width="530" height="60" rx="10" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
  <circle cx="56" cy="346" r="12" fill="url(#primaryGrad)"/>
  <text x="78" y="342" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">5,900+ Traders Trust TradeFluenza</text>
  <text x="78" y="358" font-family="system-ui, sans-serif" font-size="10.5" fill="#A5B4FC">Real-time challenges, cashback payouts &amp; leaderboards</text>
  
  <rect x="450" y="330" width="100" height="32" rx="6" fill="url(#accentGrad)"/>
  <text x="470" y="351" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Live Demo ↗</text>
</svg>
